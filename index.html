<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>P-38 라이트닝 항력 수업</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 16:9 slide stage with bottom control bar; quiz is a full-stage game mode. Sky-blue ground, ink navy text, sun-yellow + coral accents. */
:root{
  --bg:#dff0fb; --stage:#ffffff; --ink:#12263f; --ink2:#46607d; --line:#c9dcec;
  --sky:#1f8fe0; --sky-soft:#e4f3fd; --sun:#ffc533; --sun-ink:#5a3f00; --coral:#ff5a4d; --mint:#16b57a;
  --note-bg:#12263f; --note-fg:#f4f8fc; --blank-bg:#fff4cf; --blank-line:#e0a800;
  --a1:#e5484d; --a2:#1f8fe0; --a3:#f0a500; --a4:#16a56a; --on-a:#ffffff;
  --shadow:0 10px 30px rgba(18,38,63,.14);
  --f-head:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1726; --stage:#12263f; --ink:#f1f6fb; --ink2:#a9bdd3; --line:#274462;
  --sky:#59b4f5; --sky-soft:#17395a; --sun:#ffd25a; --sun-ink:#3b2900; --coral:#ff7b70; --mint:#35d39b;
  --note-bg:#050c16; --note-fg:#e9f1f9; --blank-bg:#3a3314; --blank-line:#ffd25a;
  --a1:#d93a40; --a2:#1c7cc4; --a3:#c98800; --a4:#12915a; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1726; --stage:#12263f; --ink:#f1f6fb; --ink2:#a9bdd3; --line:#274462;
  --sky:#59b4f5; --sky-soft:#17395a; --sun:#ffd25a; --sun-ink:#3b2900; --coral:#ff7b70; --mint:#35d39b;
  --note-bg:#050c16; --note-fg:#e9f1f9; --blank-bg:#3a3314; --blank-line:#ffd25a;
  --a1:#d93a40; --a2:#1c7cc4; --a3:#c98800; --a4:#12915a; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;
  padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.app{width:100%;max-width:min(1400px,calc((100dvh - 96px) * 16 / 9));flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.stage{--u:1cqw;container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--stage);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;flex:none}
@container (max-width:760px){.stage>*{--u:2.35cqw}}
@media (max-width:760px){.app{max-width:100%}.stage{aspect-ratio:auto;height:calc(100dvh - 140px);min-height:420px}.btn{padding:6px 10px}}

/* slides */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*2.6) calc(var(--u)*4);gap:calc(var(--u)*1.6);overflow:hidden}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(calc(var(--u)*2))}to{opacity:1;transform:none}}
@container (max-width:760px){.slide{overflow-y:auto;padding:calc(var(--u)*4) calc(var(--u)*5)}}
.kicker{font-weight:900;font-size:calc(var(--u)*1.45);letter-spacing:.08em;color:var(--sky);text-transform:uppercase}
h1,h2{font-family:var(--f-head);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:calc(var(--u)*3.9)}
.lead{font-size:calc(var(--u)*2.5);line-height:1.5;margin:0;font-weight:500;text-wrap:pretty}
.small{font-size:calc(var(--u)*1.7);color:var(--ink2);line-height:1.55;margin:0}
.body{flex:1;min-height:0;display:flex;gap:calc(var(--u)*3);align-items:center}
.body>*{min-width:0}
@container (max-width:760px){.body{flex-direction:column;align-items:stretch;flex:none}}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);flex:1}
.fig{flex:1.1;display:flex;align-items:center;justify-content:center;background:var(--sky-soft);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.2);align-self:stretch;min-height:0}
.fig svg{width:100%;height:100%;max-height:100%}
@container (max-width:760px){.fig{align-self:auto;min-height:calc(var(--u)*34)}}
.hl{color:var(--coral);font-weight:900}.hb{color:var(--sky);font-weight:900}

/* fill-in-the-blank chips (initial-consonant hints like the original PDF) */
.blank{display:inline-block;border:2px dashed var(--blank-line);background:var(--blank-bg);color:var(--ink);border-radius:calc(var(--u)*.9);padding:0 calc(var(--u)*1.1);font-family:var(--f-head);letter-spacing:.12em;line-height:1.35;vertical-align:baseline;white-space:nowrap}
.blank::after{content:" 눌러서 확인";font-family:var(--f-body);font-size:.45em;letter-spacing:0;color:var(--ink2);font-weight:500}
.blank.open{background:var(--sun);border-style:solid;border-color:var(--sun);color:var(--sun-ink);letter-spacing:0;animation:pop .35s}
.blank.open::after{content:""}
@keyframes pop{50%{transform:scale(1.12)}}

/* notes */
.notes{position:absolute;left:0;right:0;bottom:0;background:var(--note-bg);color:var(--note-fg);padding:calc(var(--u)*1.4) calc(var(--u)*4) calc(var(--u)*1.8);font-size:calc(var(--u)*1.55);line-height:1.6;transform:translateY(101%);transition:transform .25s;z-index:5;max-height:55%;overflow:auto}
.notes b{color:var(--sun);display:block;margin-bottom:.2em}
.stage.shownotes .notes{transform:none}
@media (prefers-reduced-motion:reduce){.slide.on,.blank.open{animation:none}.notes{transition:none}}

/* control bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.btn{background:var(--stage);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px;color:var(--ink)}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.prog{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px;transition:width .3s}
.count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:64px;text-align:center}
.menu{position:fixed;inset:0;background:rgba(5,12,22,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.menu.on{display:flex}
.menu>div{background:var(--stage);border-radius:18px;max-width:560px;width:100%;max-height:85dvh;overflow:auto;padding:20px}
.menu h3{font-family:var(--f-head);font-weight:400;font-size:24px;margin:0 0 10px}
.menu ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.menu li button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:baseline}
.menu li button:hover{background:var(--sky-soft)}
.menu li small{color:var(--ink2);font-variant-numeric:tabular-nums;min-width:28px}
.menu li.sec{font-weight:900;color:var(--sky);padding:10px 12px 2px;font-size:13px;letter-spacing:.08em}

/* title slide */
.s-title{background:linear-gradient(180deg,#1f8fe0 0%,#8fd0f5 62%,#dff0fb 100%);color:#fff;justify-content:center;align-items:flex-start}
.s-title .kicker{color:#fff;opacity:.9}
.s-title h1{font-size:calc(var(--u)*9);text-shadow:0 4px 0 rgba(18,38,63,.25)}
.s-title .lead{color:#fff;font-size:calc(var(--u)*2.6);text-shadow:0 2px 0 rgba(18,38,63,.2)}
.s-title .plane{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*4);width:calc(var(--u)*44);max-width:70%}
.s-title .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.85}
@container (max-width:760px){.s-title .plane{position:relative;right:auto;bottom:auto;width:100%;max-width:100%;margin-top:auto}}

/* goal + contents */
.goal{background:var(--sun);color:var(--sun-ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*3);font-family:var(--f-head);font-size:calc(var(--u)*3.4);line-height:1.5;text-wrap:balance}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*1.1);counter-reset:t}
.toc li{counter-increment:t;display:flex;gap:calc(var(--u)*1.4);align-items:center;font-size:calc(var(--u)*2.5);font-weight:700;background:var(--sky-soft);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1) calc(var(--u)*1.6)}
.toc li::before{content:counter(t);background:var(--sky);color:#fff;border-radius:50%;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);display:grid;place-items:center;font-family:var(--f-head);flex:none}

.facts{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*1.1)}.facts li{display:flex;gap:calc(var(--u)*1.4);align-items:baseline;font-size:calc(var(--u)*2.2);font-weight:500;background:var(--sky-soft);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1) calc(var(--u)*1.6);line-height:1.5}
/* story */
.bubble{background:var(--sky-soft);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.6) calc(var(--u)*2);font-size:calc(var(--u)*2.1);line-height:1.55;position:relative}
.bubble.b2{background:var(--blank-bg)}
.bubble b{display:block;font-family:var(--f-head);font-weight:400;color:var(--sky);font-size:.9em}
.bubble.b2 b{color:var(--sun-ink)}
:root[data-theme="dark"] .bubble.b2 b{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble.b2 b{color:var(--sun)}}

/* tug of war */
.sim{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);min-width:0}
.sim .row{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*1.2);align-items:center;font-weight:700;font-size:calc(var(--u)*1.9)}
.sim input[type=range]{width:100%;accent-color:var(--sky);height:calc(var(--u)*2.4);min-height:28px}
.sim .drag input{accent-color:var(--coral)}
.sim output{font-family:var(--f-head);font-size:calc(var(--u)*2.4);min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--f-head);font-size:calc(var(--u)*3.2);text-align:center;border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1) calc(var(--u)*1.4);transition:background .2s}
.verdict.stop{background:var(--coral);color:#fff}.verdict.go{background:var(--mint);color:#fff}.verdict.eq{background:var(--sun);color:var(--sun-ink)}
.track{position:relative;height:calc(var(--u)*13);background:var(--sky-soft);border-radius:calc(var(--u)*1.4);overflow:hidden}
.track .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--line)}
.track svg.pl{position:absolute;bottom:18%;left:4%;width:calc(var(--u)*13);transition:left .5s cubic-bezier(.3,.7,.3,1)}
.track .arr{position:absolute;top:50%;transform:translateY(-50%);height:calc(var(--u)*3.6);display:flex;align-items:center;font-family:var(--f-head);color:#fff;font-size:calc(var(--u)*1.8);transition:width .3s}
.track .arr.th{right:2%;background:var(--sky);justify-content:flex-end;padding-right:calc(var(--u)*1.2);clip-path:polygon(0 50%,12% 0,100% 0,100% 100%,12% 100%)}
.track .arr.dr{left:2%;background:var(--coral);padding-left:calc(var(--u)*1.2);clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);display:none}
.pw{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.4)}
.pw .card{background:var(--sky-soft);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2);font-size:calc(var(--u)*2.3);line-height:1.6;font-weight:500}
.pw .card .sym{font-family:var(--f-head);font-size:calc(var(--u)*4.4);display:block;line-height:1}
@container (max-width:760px){.pw{grid-template-columns:1fr}}

/* quick choice */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2)}
.choices button{border:0;border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.6);font-family:var(--f-head);font-size:calc(var(--u)*3);color:var(--on-a);min-height:44px}
.choices button:nth-child(1){background:var(--a1)}.choices button:nth-child(2){background:var(--a2)}
.choices button:nth-child(3){background:var(--a3)}.choices button:nth-child(4){background:var(--a4)}
.choices button[disabled]{opacity:.4}
.choices button.right{opacity:1;outline:5px solid var(--sun)}
.fb{min-height:calc(var(--u)*5);font-size:calc(var(--u)*2.1);font-weight:700}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.4);flex:1;min-height:0}
@container (max-width:760px){.cards{grid-template-columns:1fr 1fr}.flip{min-height:calc(var(--u)*34)}}
.flip{perspective:900px;background:none;border:0;padding:0;min-height:0}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1);text-align:center}
.flip .f{background:var(--sky-soft)}
.flip .f svg{width:80%;max-height:55%}
.flip .f b{font-family:var(--f-head);font-weight:400;font-size:calc(var(--u)*2.5)}
.flip .f span{font-size:calc(var(--u)*1.3);color:var(--ink2)}
.flip .b{background:var(--sky);color:#fff;transform:rotateY(180deg);font-size:calc(var(--u)*1.9);line-height:1.5;font-weight:500}
.flip .b b{font-family:var(--f-head);font-weight:400;font-size:calc(var(--u)*2.4);color:var(--sun)}
@media (prefers-reduced-motion:reduce){.flip>div{transition:none}}

/* videos */
.vids{display:grid;gap:calc(var(--u)*1.2);flex:1;align-content:center}
.vid{display:flex;align-items:center;gap:calc(var(--u)*1.6);background:var(--sky-soft);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.4) calc(var(--u)*2);text-decoration:none;color:var(--ink);font-size:calc(var(--u)*1.9);font-weight:700;border:2px solid transparent}
.vid:hover{border-color:var(--sky)}
.vid .t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:500}
.vid svg{flex:none;width:calc(var(--u)*4);height:calc(var(--u)*4)}

/* checklist */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.1);flex:1;align-content:center}
@container (max-width:760px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:calc(var(--u)*1.4);background:var(--sky-soft);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.3) calc(var(--u)*1.8);font-size:calc(var(--u)*2.2);font-weight:700;min-height:44px;cursor:pointer}
.checks input{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);min-width:22px;min-height:22px;accent-color:var(--mint)}
.checks label:has(input:checked){background:var(--mint);color:#fff}
.checks em{font-style:normal;font-weight:500;font-size:.75em;opacity:.8;margin-left:auto}

/* steps */
.stepno{font-family:var(--f-head);background:var(--sky);color:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.2) calc(var(--u)*1.4);font-size:calc(var(--u)*3.2);align-self:flex-start}
.stepno small{font-size:.55em;opacity:.8}
.step-ins{font-family:var(--f-head);font-size:calc(var(--u)*3.6);line-height:1.4;margin:0;text-wrap:balance}
.tip{background:var(--blank-bg);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1) calc(var(--u)*1.6);font-size:calc(var(--u)*1.8);font-weight:700}
.tip::before{content:"TIP  ";color:var(--coral);font-weight:900;letter-spacing:.08em}
.map .p{fill:var(--line);stroke:var(--ink2);stroke-width:1.5;transition:fill .3s,opacity .3s}
.map .p.act{fill:var(--sun);stroke:var(--ink);stroke-width:2.5}
.map .lab{font:700 14px var(--f-body);fill:var(--ink)}
.map .ln{stroke:var(--ink2);stroke-width:1.5;fill:none}
.map .dim{opacity:.45}

/* quiz mode */
.quiz{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(160deg,#5b3fd0,#2a1a7a);color:#fff;z-index:8;padding:calc(var(--u)*2.4) calc(var(--u)*3.4);gap:calc(var(--u)*1.6);overflow:hidden}
.quiz.on{display:flex}
@container (max-width:760px){.quiz{overflow-y:auto;padding:calc(var(--u)*4)}}
.quiz h2{color:#fff}
.q-top{display:flex;align-items:center;gap:calc(var(--u)*1.4);font-weight:700;font-size:calc(var(--u)*1.8);flex-wrap:wrap}
.q-top .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:calc(var(--u)*.5) calc(var(--u)*1.5);font-variant-numeric:tabular-nums}
.q-top .sp{flex:1}
.timer{height:calc(var(--u)*1.1);background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:var(--sun);transform-origin:left;border-radius:99px}
.q-text{font-family:var(--f-head);font-size:calc(var(--u)*3.4);line-height:1.35;text-align:center;text-wrap:balance;margin:0;padding:calc(var(--u)*1) 0;flex:none;min-height:calc(var(--u)*10);display:flex;align-items:center;justify-content:center}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.3);flex:1;min-height:0}
@container (max-width:760px){.ans{grid-template-columns:1fr;flex:none}}
.ans button{border:0;border-radius:calc(var(--u)*1.6);color:#fff;display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.2) calc(var(--u)*2);font-size:calc(var(--u)*2.5);font-weight:700;text-align:left;box-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.28);min-height:calc(var(--u)*7);transition:transform .1s,opacity .2s}
.ans button:active{transform:translateY(3px)}
.ans button svg{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);flex:none;fill:#fff}
.ans button[data-c="0"]{background:var(--a1)}.ans button[data-c="1"]{background:var(--a2)}
.ans button[data-c="2"]{background:var(--a3)}.ans button[data-c="3"]{background:var(--a4)}
.ans.done button{opacity:.35;pointer-events:none}
.ans.done button.right{opacity:1;outline:5px solid #fff}
.ans.done button.mine.wrong{opacity:.6;text-decoration:line-through}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);text-align:center}
.center .big{font-family:var(--f-head);font-size:calc(var(--u)*5.6);line-height:1.15}
.center p{margin:0;font-size:calc(var(--u)*2.1);line-height:1.55;max-width:58ch;text-wrap:balance}
.nick{font:inherit;font-size:calc(var(--u)*2.6);border-radius:calc(var(--u)*1.4);border:0;padding:calc(var(--u)*1.2) calc(var(--u)*2);text-align:center;width:min(100%,calc(var(--u)*34));min-height:44px;background:#fff;color:#1b1340}
.qbtn{border:0;border-radius:calc(var(--u)*1.6);background:var(--sun);color:var(--sun-ink);font-family:var(--f-head);font-size:calc(var(--u)*2.8);padding:calc(var(--u)*1.2) calc(var(--u)*3.6);box-shadow:0 calc(var(--u)*.6) 0 #b78600;min-height:44px}
.qbtn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-size:calc(var(--u)*2)}

add({sec:'항력',title:'항력의 종류',html:`
  <div class="kicker">개념설명 · 항력의 종류</div><h2>항력도 종류가 있어요</h2>
  <div class="body"><div class="pw">
   <div class="card"><span class="sym hb">유해항력</span>${blank('ㅇㅎㅎㄹ','유해항력')}이란 양력과 특별한 상관이 없이 <span class="hb">발생하는 항력</span>을 말해요.<br><span class="small">예: 공기와 닿아 생기는 마찰, 비행기 모양 때문에 생기는 압력 차이</span></div>
   <div class="card"><span class="sym hl">유도항력</span>${blank('ㅇㄷㅎㄹ','유도항력')}이란 비행기가 하늘을 날 때 <span class="hl">와류</span>로 인해 생기는 항력을 말해요.<br><span class="small">와류: 날개 끝에서 공기가 소용돌이 모양으로 도는 흐름</span></div></div></div>`,
  notes:'항력은 상황이나 생기는 부위에 따라 여러 가지 종류로 나눌 수 있어요. 유해항력에는 압력항력(주변의 압력에 의해 생기는 항력), 마찰항력(마찰 때문에 생기는 항력), 조파항력(충격파에 의해 생기는 항력), 간섭항력(부품의 이음새에서 생기는 항력), 트림항력(항공기의 조종면(승강타, 방향타 등)에서 생기는 항력)이 있어요. 유도항력은 비행기 날개의 끝이 공기를 가르며 생기는 소용돌이 모양의 와류로 인해 생기는 항력을 말해요.'});

add({sec:'항력',title:'잠깐 퀴즈!',html:`

add({sec:'만들기',title:'오늘의 KIT: P-38',html:`

add({sec:'만들기',title:'P-38과 에어브레이크',html:`

/* ---------- render deck ---------- */
const $=s=>document.querySelector(s);
const slidesEl=$('#slides');
S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(s.cls||'');el.dataset.i=i;el.innerHTML=s.html;slidesEl.appendChild(el);});
const slideEls=[...slidesEl.children];
let cur=0;
const notesEl=$('#notes'),stage=$('#stage');
function go(n,fromHash){
  if(n<0||n>=S.length)return;
  cur=n;slideEls.forEach((e,i)=>e.classList.toggle('on',i===n));
  notesEl.innerHTML=S[n].notes?`<b>강의노트</b>${S[n].notes}`:`<b>강의노트</b>이 슬라이드는 따로 적은 노트가 없어요.`;
  $('#count').textContent=`${n+1} / ${S.length}`;
  $('#pbar').style.width=((n+1)/S.length*100)+'%';
  $('#prev').disabled=n===0;$('#next').disabled=n===S.length-1;
  const sl=slideEls[n];if(sl.scrollTo)sl.scrollTo(0,0);
  const act=sl.querySelector('[data-act]');
  if(act){const on=act.dataset.act.split(',');act.querySelectorAll('.p').forEach(p=>{const a=on.includes(p.dataset.p);p.classList.toggle('act',a);p.classList.toggle('dim',!a)});}
  if(!fromHash){try{history.replaceState(null,'','#s'+(n+1))}catch(e){}}
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#noteBtn').onclick=e=>{const on=stage.classList.toggle('shownotes');e.currentTarget.setAttribute('aria-pressed',on)};
$('#fsBtn').onclick=()=>{try{const r=document.documentElement.requestFullscreen?.();r&&r.catch(()=>{})}catch(e){}};
/* menu */
const menu=$('#menu');let lastSec='';
$('#menuList').innerHTML=S.map((s,i)=>{let h='';if(s.sec!==lastSec){h=`<li class="sec">${s.sec}</li>`;lastSec=s.sec}return h+`<li><button data-g="${i}"><small>${i+1}</small>${s.title}</button></li>`}).join('');
$('#menuBtn').onclick=()=>menu.classList.add('on');$('#menuClose').onclick=()=>menu.classList.remove('on');
menu.onclick=e=>{const b=e.target.closest('[data-g]');if(b){go(+b.dataset.g);menu.classList.remove('on')}else if(e.target===menu)menu.classList.remove('on')};
/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=text]'))return;
  if(quizOn){const n=+e.key;if(n>=1&&n<=4)answerBtn(n-1);else if(e.key==='Enter'||e.key===' ')return;return;}
  if(e.target.matches('input[type=range]')&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)}
  else if(e.key==='n'||e.key==='N'){$('#noteBtn').click()}
  else if(e.key==='Escape'){menu.classList.remove('on')}
});
/* swipe */
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null||quizOn)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70)go(cur+(d<0?1:-1));tx=null});
/* blanks */
slidesEl.addEventListener('click',e=>{const b=e.target.closest('.blank');if(b){b.classList.toggle('open');b.textContent=b.classList.contains('open')?b.dataset.a:b.dataset.h||b.dataset.a;}
  const f=e.target.closest('.flip');if(f)f.classList.toggle('on');});
document.querySelectorAll('.blank').forEach(b=>{b.dataset.h=b.textContent});
/* quick quiz */
$('#q4f').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ok=!!b.dataset.ok;
  document.querySelectorAll('#q4f button').forEach(x=>{x.disabled=!x.dataset.ok&&x!==b;if(x.dataset.ok)x.classList.add('right')});
  $('#q4fb').innerHTML=ok?'<span class="hb">정답! 멈추려면 항력이 가장 커야 해요.</span>':'<span class="hl">아쉬워요. 정답은 항력이에요.</span>';if(ok)burst();});
/* tug of war */
const thr=$('#thr'),drg=$('#drg');
function sim(){const t=+thr.value,d=+drg.value;$('#thrO').textContent=t;$('#drgO').textContent=d;
  const v=$('#verdict'),pl=$('#simPl'),ta=$('#thA');
  ta.style.width=(12+t*5)+'%';
  if(d>t){v.className='verdict stop';v.textContent='항력이 더 커요: 비행기가 멈춰요';pl.style.left='4%'}
  else if(d<t){v.className='verdict go';v.textContent='추력이 더 커요: 비행기가 나아가요';pl.style.left=(10+(t-d)*5.2)+'%'}
  else{v.className='verdict eq';v.textContent='두 힘이 같아요: 지금 속도 그대로예요';pl.style.left='28%'}}
thr.oninput=drg.oninput=sim;sim();

/* ---------- confetti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=stage.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
  const cols=['#ffc533','#ff5a4d','#1f8fe0','#16b57a','#fff'];
  parts=Array.from({length:70},()=>({x:r.width/2,y:r.height*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,c:cols[Math.random()*5|0],a:Math.random()*6,l:70+Math.random()*30}));
  cancelAnimationFrame(raf);(function f(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.l/40);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});parts=parts.filter(p=>p.l>0);if(parts.length)raf=requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})()}

/* ---------- sound ---------- */
let actx=null,muted=false;
function tone(f,d,type='sine',v=.12,delay=0){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){tone(660,.15);tone(880,.2,'sine',.12,.12);tone(1100,.25,'sine',.1,.26)},no(){tone(220,.3,'sawtooth',.08);tone(160,.35,'sawtooth',.08,.2)},tick(){tone(900,.05,'square',.04)},start(){tone(523,.12);tone(659,.12,'sine',.12,.12);tone(784,.25,'sine',.12,.24)}};

/* ---------- Quizizz-style quiz ---------- */
const SHAPES=['<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg>','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'];
const Q=[
 {q:'물체가 공기 같은 유체를 가로질러 움직일 때, 그 움직임을 방해하는 힘은 무엇일까요?',o:['항력','양력','중력','추력'],a:0,e:'항력은 비행기를 뒤에서 잡아당기듯 움직임을 방해하는 힘이에요. 저항력이라고도 해요.'},
 {q:'비행기가 앞으로 나아가려고 할 때, 항력이 추력보다 크면 어떻게 될까요?',o:['움직이지 않고 멈춰요','더 빨리 날아요','하늘로 높이 떠올라요','뒤로 날아가요'],a:0,e:'항력이 추력보다 크면 앞으로 나아가지 못하고 멈춰요. 항력이 추력보다 작으면 나아가요.'},
 {q:'비행기의 항력을 줄이는 가장 대표적인 방법은 동체를 어떤 모양으로 만드는 걸까요?',o:['네모난 상자 모양','유선형','납작한 판 모양','뾰족뾰족한 별 모양'],a:1,e:'유선형은 앞뒤가 가늘고 가운데가 볼록해서 공기가 부드럽게 흘러가요. 그래서 항력이 줄어요.'},
 {q:'착륙할 때 비행기 뒤에서 낙하산을 펼쳐 공기저항을 키우는 고항력장치의 이름은?',o:['스포일러','역추진장치','드래그슈트','에어브레이크'],a:2,e:'우주왕복선과 전투기, 레이싱카도 드래그슈트로 속도를 줄여요.'},
 {q:'오늘 만든 P-38 "라이트닝(Lightning)"은 무슨 뜻일까요?',o:['폭풍','번개','구름','바람'],a:1,e:'Lightning은 번개라는 뜻의 별명이에요. P는 추격기, 38은 38번째 모델이라는 뜻이에요.'},
 {q:'고항력장치에 대한 설명으로 틀린 것을 고르세요.',o:['역추진장치는 제트엔진의 추력을 반대로 해서 속도를 줄여요','드래그슈트는 착륙할 때 항력을 키워 줘요','항력을 줄이면 비행기는 더 빨리 날 수 있어요','항력이 하나도 없어도 비행기를 잘 멈출 수 있어요'],a:3,wrong:true,e:'항력이 전혀 없으면 비행기를 멈출 수 없어요. 그래서 착륙할 때는 고항력장치로 항력을 키워요.'}];
const TIME=20;
let quizOn=false,qi=0,score=0,streak=0,best=0,right=0,results=[],t0=0,timerId=0,locked=false,order=[],useTimer=true,name='';
const qz=$('#quiz');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function showQuiz(h){qz.innerHTML=h}
function quizIntro(){quizOn=true;qz.classList.add('on');
  showQuiz(`<div class="center"><div class="kicker" style="color:#ffd25a">QUIZ</div><div class="big">P-38 항력 퀴즈</div><p>6문제 · 문제마다 ${TIME}초 · 정답을 빨리 누를수록 점수가 높아져요!</p>
   <input class="nick" id="nick" type="text" maxlength="10" placeholder="내 이름(별명)을 적어요" aria-label="이름 입력" autocomplete="off">
   <div class="opts"><label><input type="checkbox" id="useT" checked> 시간 제한 켜기</label><label><input type="checkbox" id="mute"> 소리 끄기</label></div>
   <button class="qbtn" id="go">시작!</button><button class="qbtn ghost" id="exitQ">수업 화면으로 돌아가기</button></div>`);
  $('#go').onclick=()=>{name=($('#nick').value||'').trim()||'조종사';useTimer=$('#useT').checked;muted=$('#mute').checked;sfx.start();
    qi=0;score=0;streak=0;best=0;right=0;results=[];showQ()};
  $('#exitQ').onclick=quizExit;$('#nick').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
}
function quizExit(){quizOn=false;clearInterval(timerId);qz.classList.remove('on')}
function showQ(){const q=Q[qi];locked=false;
  order=shuffle([0,1,2,3]);// order[k] = original option index shown at position k
  showQuiz(`<div class="q-top"><span class="pill">${qi+1} / ${Q.length}</span><span class="pill">${name}</span><span class="sp"></span><span class="pill">연속 정답 ${streak}</span><span class="pill">${score}점</span></div>
   ${useTimer?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':''}
   <h2 class="q-text">${q.wrong?'<span style="color:#ffd25a">틀린 것</span>을 고르세요.':q.q}</h2>
   ${q.wrong?'<p class="small" style="color:#fff;text-align:center;margin:0">고항력장치에 대한 설명 중에서요.</p>':''}
   <div class="ans" id="ans">${order.map((o,k)=>`<button data-c="${k}" data-k="${k}">${SHAPES[k]}<span>${q.o[o]}</span></button>`).join('')}</div>`);
  $('#ans').onclick=e=>{const b=e.target.closest('button');if(b)answerBtn(+b.dataset.k)};
  t0=performance.now();clearInterval(timerId);
  if(useTimer){const bar=$('#tbar');timerId=setInterval(()=>{const left=Math.max(0,TIME-(performance.now()-t0)/1000);bar.style.transform=`scaleX(${left/TIME})`;if(left<=5&&left>0&&Math.abs(left-Math.round(left))<.06)sfx.tick();if(left<=0){clearInterval(timerId);answerBtn(-1)}},60)}
}
function answerBtn(k){if(!quizOn||locked||!$('#ans'))return;locked=true;clearInterval(timerId);
  const q=Q[qi],picked=k<0?-1:order[k],ok=picked===q.a,el=(performance.now()-t0)/1000;
  let gain=0;if(ok){const f=useTimer?Math.max(0,1-el/TIME):.5;gain=600+Math.round(400*f);streak++;best=Math.max(best,streak);if(streak>=2)gain+=Math.min(300,(streak-1)*100);score+=gain;right++;}else streak=0;
  results.push(ok);
  const ans=$('#ans');ans.classList.add('done');ans.querySelectorAll('button').forEach((b,i)=>{if(order[i]===q.a)b.classList.add('right');if(i===k){b.classList.add('mine');if(!ok)b.classList.add('wrong')}});
  ok?sfx.ok():sfx.no();if(ok)burst();
  setTimeout(()=>{showQuiz(`<div class="q-top"><span class="pill">${qi+1} / ${Q.length}</span><span class="pill">${name}</span><span class="sp"></span><span class="pill">${score}점</span></div>
   <div class="center"><div class="res ${ok?'ok':'no'}"><span class="hd">${k<0?'시간 끝!':ok?'정답이에요!':'아쉬워요!'}</span>
   ${ok?`<span class="pts">+${gain}점</span>${streak>=2?` · 연속 정답 ${streak}번째!`:''}<br>`:`정답: <b>${q.o[q.a]}</b><br>`}${q.e}</div>
   <button class="qbtn" id="nx">${qi===Q.length-1?'결과 보기':'다음 문제'}</button></div>`);
   $('#nx').onclick=()=>{qi++;qi<Q.length?showQ():finish()};$('#nx').focus()},ok?650:900);
}
function finish(){sfx.start();if(right>=4)burst();
  const title=right===6?'항력 마스터 조종사':right>=4?'에이스 파일럿':right>=2?'견습 파일럿':'지상 정비사';
  const star=n=>`<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z" fill="${n?'#ffc533':'rgba(255,255,255,.25)'}"/></svg>`;
  const nStars=right>=5?3:right>=3?2:right>=1?1:0;
  showQuiz(`<div class="center"><div class="kicker" style="color:#ffd25a">${name} 조종사의 결과</div><div class="big">${title}</div>
   <div class="stars" role="img" aria-label="별 ${nStars}개">${star(nStars>0)}${star(nStars>1)}${star(nStars>2)}</div>
   <div class="sumgrid"><div><b>${score}</b>점수</div><div><b>${right}/${Q.length}</b>정답</div><div><b>${best}</b>최고 연속</div></div>
   <div class="review" aria-label="문제별 결과">${results.map((r,i)=>`<i class="${r?'ok':'no'}">${i+1}</i>`).join('')}</div>
   <p>${right===6?'모든 문제를 맞혔어요! 항력 박사님이네요.':right>=4?'아주 잘했어요! 틀린 문제는 슬라이드에서 다시 확인해 봐요.':'괜찮아요. 슬라이드를 다시 보고 한 번 더 도전해요!'}</p>
   <button class="qbtn" id="again">다시 도전</button><button class="qbtn ghost" id="exitQ">수업 화면으로 돌아가기</button></div>`);
  $('#again').onclick=quizIntro;$('#exitQ').onclick=quizExit;}
document.addEventListener('click',e=>{if(e.target.id==='startQuiz')quizIntro()});

/* start */
const h=parseInt((location.hash||'').replace('#s',''),10);go(h>=1&&h<=S.length?h-1:0,true);
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.replace('#s',''),10);if(n>=1&&n<=S.length&&n-1!==cur)go(n-1,true)});
</script>
